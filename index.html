<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#681d32">
	<title>Mohamed &amp; Bassma | Engagement Invitation</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: dark;
			--wine: #681d32;
			--wine-deep: #481323;
			--wine-light: #8a344b;
			--gold: #d6bb83;
			--paper: #f7f0e3;
			--ink: #493342;
			--serif: "Cormorant Garamond", "Times New Roman", serif;
			--sans: "Montserrat", "Trebuchet MS", sans-serif;
		}

		* { box-sizing: border-box; }

		html, body { width: 100%; min-height: 100%; margin: 0; }

		body {
			min-height: 100svh;
			overflow: hidden;
			background: var(--wine-deep);
			color: var(--paper);
			font-family: var(--serif);
		}

		.scene {
			position: relative;
			isolation: isolate;
			display: grid;
			min-height: 100svh;
			place-items: center;
			overflow: hidden;
			background:
				radial-gradient(ellipse at 50% 40%, rgba(174, 100, 99, .24), transparent 62%),
				linear-gradient(145deg, #4a1527, #76283d 48%, #481323);
		}

		.scene::before {
			position: absolute;
			inset: 500px;
			/* border: 1px solid rgba(214, 187, 131, .43); */
			content: "";
			pointer-events: none;
		}

		.scene::after {
			position: absolute;
			inset: 19px;
			border: 1px solid rgba(214, 187, 131, .17);
			content: "";
			pointer-events: none;
		}

		.envelope {
			position: absolute;
			inset: -5%;
			overflow: hidden;
			perspective: 1400px;
			background:
				radial-gradient(ellipse at 50% 54%, rgba(255, 221, 186, .12), transparent 55%),
				linear-gradient(155deg, #76283d 0%, #651a30 58%, #511326 100%);
		}

		.envelope::before {
			position: absolute;
			inset: 0;
			background-image: repeating-linear-gradient(116deg, transparent 0 5px, rgba(255,255,255,.012) 6px, transparent 7px 12px);
			content: "";
			opacity: .55;
			pointer-events: none;
		}

		.paper {
			position: absolute;
			z-index: 1;
			top: 50%;
			left: 50%;
			display: grid;
			width: min(82vw, 430px);
			height: min(72svh, 690px);
			min-height: 440px;
			padding: clamp(23px, 6vw, 42px);
			place-items: center;
			transform: translate(-50%, 27%) scale(.94);
			border: 1px solid #ddcda9;
			outline: 1px solid rgba(164, 133, 91, .44);
			outline-offset: -8px;
			background:
				radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.72), transparent 68%),
				repeating-linear-gradient(0deg, rgba(120, 91, 69, .018) 0 1px, transparent 1px 4px),
				var(--paper);
			box-shadow: 0 18px 55px rgba(29, 5, 15, .3);
			color: var(--ink);
			opacity: 0;
			transition: transform 1800ms cubic-bezier(.2,.75,.18,1), opacity 900ms ease;
		}

		.paper-content {
			width: 100%;
			text-align: center;
		}

		.ornament {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			color: #a98554;
		}

		.ornament::before, .ornament::after {
			width: 100px;
			height: 10px;
			background: #b79a6f;
			content: "";
		}

		.ornament span { font-size: 16px; line-height: 1; }

		.invitation-label {
			margin: 21px 0 17px;
			color: #806b5c;
			font-family: var(--sans);
			font-size: 9px;
			font-weight: 500;
			letter-spacing: 2.7px;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			color: #6b293c;
			font-size: clamp(48px, 13vw, 67px);
			font-weight: 500;
			line-height: .86;
		}

		h1 span { display: block; }

		h1 .ampersand {
			margin: 7px 0 5px;
			color: #a98554;
			font-size: 37px;
			font-style: italic;
			line-height: 1;
		}

		.invitation-copy {
			max-width: 255px;
			margin: 21px auto 20px;
			color: #69585b;
			font-size: 18px;
			line-height: 1.32;
		}

		.date {
			margin: 0;
			color: #6b293c;
			font-size: clamp(27px, 7vw, 34px);
			font-weight: 500;
			line-height: 1;
		}

		.venue {
			margin: 12px 0 0;
			color: #69585b;
			font-size: 19px;
			line-height: 1.15;
		}

		.city {
			margin: 5px 0 0;
			color: #806b5c;
			font-family: var(--sans);
			font-size: 9px;
			letter-spacing: 2px;
			text-transform: uppercase;
		}

		.map-link {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 7px;
			margin-top: 12px;
			color: #79563c;
			font-family: var(--sans);
			font-size: 9px;
			letter-spacing: 1px;
			text-decoration: none;
			text-transform: uppercase;
		}

		.map-icon {
			display: inline-flex;
			animation: location-cue 1.8s ease-in-out infinite;
			transform-style: preserve-3d;
		}

		.map-link svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; }

		@keyframes location-cue {
			0%, 100% { transform: translateY(0) rotateY(0deg); }
			50% { transform: translateY(-5px) rotateY(180deg); }
		}

		.map-link:hover { color: #6b293c; }
		.map-link:focus-visible { outline: 1px solid #a98554; outline-offset: 4px; }

		.paper .bottom-ornament { margin-top: 20px; }

		.flap {
			position: absolute;
			z-index: 3;
			inset: 2px;
			background: var(--wine-light);
			transition: transform 1700ms cubic-bezier(.22,.72,.17,1), opacity 1100ms ease;
			pointer-events: none;
		}

		.flap-top {
			z-index: 5;
			clip-path: polygon(0 0, 100% 0, 100% 30%, 50% 52%, 0 30%);
			transform-origin: 50% 0;
			background: linear-gradient(155deg, #87354b, #71223a 72%);
			filter: drop-shadow(0 8px 7px rgba(44, 8, 20, .18));
		}

		.flap-left {
			clip-path: polygon(0 0, 30% 0, 50% 52%, 30% 100%, 0 100%);
			transform-origin: 0 50%;
			background: linear-gradient(90deg, #5b182d, #79263e);
		}

		.flap-right {
			clip-path: polygon(100% 0, 82% 0, 50% 52%, 82% 100%, 100% 100%);
			transform-origin: 100% 50%;
			background: linear-gradient(270deg, #501326, #74243b);
		}

		.flap-bottom {
			z-index: 4;
			clip-path: polygon(0 100%, 0 80%, 50% 49%, 100% 80%, 100% 100%);
			transform-origin: 50% 100%;
			background: linear-gradient(0deg, #541528, #76243c);
			filter: drop-shadow(0 -8px 7px rgba(44, 8, 20, .2));
		}

		.seal {
			position: absolute;
			z-index: 6;
			top: 50%;
			left: 50%;
			display: grid;
			width: 100px;
			aspect-ratio: 3;
			place-items: center;
			transform: translate(-50%, -50%);
			border: 1px solid rgba(239, 215, 161, .88);
			border-radius: 50%;
			background: radial-gradient(circle at 35% 30%, #a64b59, #702039 70%);
			box-shadow: 0 4px 15px rgba(35, 5, 14, .28), inset 0 0 0 4px rgba(76, 15, 33, .35);
			color: #f0dca9;
			font-size: 23px;
			transition: opacity 700ms ease, transform 1300ms ease;
			pointer-events: none;
		}

		.seal img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		.open-button {
			position: absolute;
			width: 1px;
			height: 1px;
			margin: -1px;
			padding: 0;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
			cursor: pointer;
		}

		.open-button:focus-visible {
			position: fixed;
			z-index: 10;
			top: 16px;
			left: 16px;
			width: auto;
			height: auto;
			margin: 0;
			padding: 10px 14px;
			clip: auto;
			border: 1px solid var(--gold);
			background: var(--wine-deep);
			color: var(--paper);
			font-family: var(--sans);
			font-size: 12px;
			white-space: normal;
		}

		.hint {
			position: absolute;
			z-index: 7;
			top: 10%;
			left: 0;
			width: 100%;
			color: rgba(248, 234, 211, .83);
			font-family: var(--sans);
			font-size: 9px;
			letter-spacing: 2.5px;
			text-align: center;
			text-transform: uppercase;
			transition: opacity 600ms ease;
			pointer-events: none;
		}

		.scene.is-open .paper {
			z-index: 2;
			transform: translate(-50%, -50%) scale(1.1);
			opacity: 1;
			transition-delay: 400ms;
		}

		.scene.is-open .flap-top { transform: rotateX(178deg); }
		.scene.is-open .flap-left { transform: rotateY(-145deg); opacity: .2; }
		.scene.is-open .flap-right { transform: rotateY(145deg); opacity: .2; }
		.scene.is-open .flap-bottom { transform: rotateX(-145deg); opacity: .2; }
		.scene.is-open .seal { transform: translate(-50%, -50%) scale(.5); opacity: 0; }
		.scene.is-open .hint { opacity: 0; }
		@media (max-height: 680px) {
			.paper { height: 76svh; min-height: 0; }
			.invitation-label { margin: 12px 0; }
			.invitation-copy { margin: 14px auto; font-size: 16px; }
			.paper .bottom-ornament { margin-top: 14px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
			.map-icon { animation: none; }
		}
	</style>
</head>
<body>
	<main class="scene" id="scene">
		<div class="envelope">
			<article class="paper" id="invitation" aria-hidden="true">
				<div class="paper-content">
					<div class="ornament" aria-hidden="true"><span>✦</span></div>
					<p class="invitation-label">Together with their families</p>
					<h1><span>Mohamed</span><span class="ampersand">&amp;</span><span>Bassma</span></h1>
					<p class="invitation-copy">joyfully invite you to celebrate their engagement</p>
					<div class="ornament" aria-hidden="true"><span>❧</span></div>
					<p class="date">October 8th, 2026</p>
					<p class="venue">Dar Al Deyafa</p>
					<p class="city">Nasr City</p>
					<a class="map-link" href="https://maps.app.goo.gl/WNYzwnGcYdknMHhK8" target="_blank" rel="noopener noreferrer" aria-label="Open Dar Al Deyafa in Google Maps">
						<span class="map-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.3"/></svg></span>
						<span>View location</span>
					</a>
					<div class="ornament bottom-ornament" aria-hidden="true"><span>✦</span></div>
				</div>
			</article>
			<div class="flap flap-left" aria-hidden="true"></div>
			<div class="flap flap-right" aria-hidden="true"></div>
			<div class="flap flap-bottom" aria-hidden="true"></div>
			<div class="flap flap-top" aria-hidden="true"></div>
			<div class="seal" aria-hidden="true"><img src="stamp6.png" alt=""></div>
		</div>
		<p class="hint" aria-hidden="true">An invitation awaits</p>
		<button class="open-button" id="openButton" type="button" aria-expanded="false" aria-controls="invitation">
			<span>Open invitation</span>
		</button>
	</main>
	<script>
		const scene = document.getElementById("scene");
		const button = document.getElementById("openButton");
		const invitation = document.getElementById("invitation");

		button.addEventListener("click", () => {
			toggleInvitation();
		});

		function toggleInvitation() {
			const isOpen = scene.classList.toggle("is-open");
			button.setAttribute("aria-expanded", String(isOpen));
			button.querySelector("span").textContent = isOpen ? "Close invitation" : "Open invitation";
			invitation.setAttribute("aria-hidden", String(!isOpen));
		}

		scene.addEventListener("click", (event) => {
			if (event.target.closest("a, button")) return;
			toggleInvitation();
		});
	</script>
</body>
</html>
